ss="monos" fill="#98A2BD"></text><text x="710" y="332" text-anchor="end" class="monos" fill="#98A2BD">guided</text><rect x="720" y="320" width="300" height="15" rx="7.5" fill="#26304F" fill-opacity="0.5"/><rect class="grow" style="animation-delay:1.02s" x="720" y="320" width="273.0" height="15" rx="7.5" fill="#2DD4BF"/><text x="1001.0" y="332" class="mono" fill="#EEF1FA">0.91</text><text x="552" y="356" class="monos" fill="#EEF1FA">Qwen2.5-1.5B</text><text x="710" y="356" text-anchor="end" class="monos" fill="#98A2BD">naive</text><rect x="720" y="344" width="300" height="15" rx="7.5" fill="#26304F" fill-opacity="0.5"/><rect class="grow" style="animation-delay:1.14s" x="720" y="344" width="219.0" height="15" rx="7.5" fill="#5B6683"/><text x="947.0" y="356" class="mono" fill="#EEF1FA">0.73</text><text x="552" y="380" class="monos" fill="#98A2BD"></text><text x="710" y="380" text-anchor="end" class="monos" fill="#98A2BD">guided</text><rect x="720" y="368" width="300" height="15" rx="7.5" fill="#26304F" fill-opacity="0.5"/><rect class="grow" style="animation-delay:1.26s" x="720" y="368" width="216.0" height="15" rx="7.5" fill="#A78BFA"/><text x="944.0" y="380" class="mono" fill="#EEF1FA">0.72</text><g class="pop" style="animation-delay:1.6s"><circle cx="1112" cy="332" r="40" fill="none" stroke="#26304F" stroke-width="7"/><circle class="ring" cx="1112" cy="332" r="40" fill="none" stroke="#2DD4BF" stroke-width="7" stroke-linecap="round" pathLength="100" stroke-dasharray="73 100" transform="rotate(-90 1112 332)"/><text x="1112" y="330" text-anchor="middle" class="mono" style="font-size:19px;font-weight:800" fill="#EEF1FA">κ .73</text><text x="1112" y="346" text-anchor="middle" class="monos" style="font-size:10px" fill="#98A2BD">≥ .60 req.</text><text x="1112" y="390" text-anchor="middle" class="monos" style="font-size:11px" fill="#98A2BD">blinded audit</text></g></g></svg>
