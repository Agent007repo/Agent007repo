  </g>
  <rect width="1200" height="440" fill="url(#grid-cb)" mask="url(#gridmask-cb)"/>
</g>
<rect x="0.5" y="0.5" width="1199" height="439" rx="28" fill="none" stroke="#DCE2F0"/>

<g class="rise"><text x="56" y="62" class="eyebrow" fill="#B45309">FEATURED RESEARCH · 02</text></g>
<g class="rise" style="animation-delay:.1s"><text x="54" y="114" class="title" fill="#0B1222">ContinuumBench</text></g>
<g class="rise" style="animation-delay:.2s">
  <text x="56" y="146" class="tagline" fill="#4F5A73">What does running an LLM under your own control</text>
  <text x="56" y="168" class="tagline" fill="#4F5A73">really cost in accuracy, latency and joules?</text>
</g>
