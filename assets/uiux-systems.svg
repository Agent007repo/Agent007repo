<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">UX-led AI product systems</title>
  <desc id="desc">An Apple-inspired visual system showing how research, structure, prototyping, measurement, and iteration connect in UX-led product work.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="76%" cy="0%" r="72%">
      <stop offset="0%" stop-color="#DBEAFE" stop-opacity="0.95"/>
      <stop offset="46%" stop-color="#F5F5F7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F5F5F7"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="darkPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D1D1F"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="softShadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#86868B"/>
    </marker>
    <style>
      .h1 { font: 760 38px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; fill: #1D1D1F; letter-spacing: 0; }
      .sub { font: 450 18px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #6E6E73; letter-spacing: 0; }
      .num { font: 700 15px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #FFFFFF; letter-spacing: 0; }
      .cardTitle { font: 700 21px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; fill: #1D1D1F; letter-spacing: 0; }
      .cardCopy { font: 450 14px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #6E6E73; letter-spacing: 0; }
      .panelTitle { font: 700 22px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; fill: #F5F5F7; letter-spacing: 0; }
      .panelCopy { font: 500 15px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #D2D2D7; letter-spacing: 0; }
      .footerStrong { font: 700 21px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; fill: #F5F5F7; letter-spacing: 0; }
      .footer { font: 450 20px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #D2D2D7; letter-spacing: 0; }
    </style>
  </defs>

  <rect width="1200" height="460" rx="34" fill="url(#bgGlow)"/>
  <path d="M64 114 H640" stroke="#1D1D1F" stroke-width="1" stroke-linecap="round" opacity="0.12"/>
  <text class="h1" x="64" y="74">UX-led AI product systems</text>
  <text class="sub" x="64" y="104">A calm design model for making analytics and AI workflows understandable, trusted, and measurable.</text>

  <g transform="translate(64 154)">
    <path d="M174 75 H218" stroke="#86868B" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)" opacity="0.8"/>
    <path d="M392 75 H436" stroke="#86868B" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)" opacity="0.8"/>
    <path d="M610 75 H654" stroke="#86868B" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)" opacity="0.8"/>

    <g filter="url(#softShadow)">
      <rect x="0" y="0" width="176" height="150" rx="26" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.75"/>
      <circle cx="34" cy="34" r="16" fill="#007AFF"/>
      <text class="num" x="30" y="40">1</text>
      <text class="cardTitle" x="24" y="76">Discover</text>
      <text class="cardCopy" x="24" y="105">User jobs, pain</text>
      <text class="cardCopy" x="24" y="126">points, success</text>

      <rect x="218" y="0" width="176" height="150" rx="26" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.75"/>
      <circle cx="252" cy="34" r="16" fill="#5856D6"/>
      <text class="num" x="248" y="40">2</text>
      <text class="cardTitle" x="242" y="76">Structure</text>
      <text class="cardCopy" x="242" y="105">Flows, hierarchy,</text>
      <text class="cardCopy" x="242" y="126">decision paths</text>

      <rect x="436" y="0" width="176" height="150" rx="26" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.75"/>
      <circle cx="470" cy="34" r="16" fill="#34C759"/>
      <text class="num" x="466" y="40">3</text>
      <text class="cardTitle" x="460" y="76">Prototype</text>
      <text class="cardCopy" x="460" y="105">Screens, states,</text>
      <text class="cardCopy" x="460" y="126">feedback loops</text>

      <rect x="654" y="0" width="176" height="150" rx="26" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.75"/>
      <circle cx="688" cy="34" r="16" fill="#FF9500"/>
      <text class="num" x="684" y="40">4</text>
      <text class="cardTitle" x="678" y="76">Measure</text>
      <text class="cardCopy" x="678" y="105">Trust, adoption,</text>
      <text class="cardCopy" x="678" y="126">conversion</text>
    </g>
  </g>

  <g transform="translate(934 134)" filter="url(#softShadow)">
    <rect x="0" y="0" width="204" height="212" rx="28" fill="url(#darkPanel)"/>
    <text class="panelTitle" x="24" y="44">Design proof</text>
    <text class="panelCopy" x="24" y="82">Clear hierarchy</text>
    <path d="M24 96 H180" stroke="#FFFFFF" stroke-opacity="0.11"/>
    <text class="panelCopy" x="24" y="124">Usable states</text>
    <path d="M24 138 H180" stroke="#FFFFFF" stroke-opacity="0.11"/>
    <text class="panelCopy" x="24" y="166">Trust signals</text>
    <path d="M24 180 H180" stroke="#FFFFFF" stroke-opacity="0.11"/>
    <text class="panelCopy" x="24" y="198">Metric loops</text>
  </g>

  <g transform="translate(64 366)">
    <rect x="0" y="0" width="1072" height="58" rx="29" fill="url(#darkPanel)"/>
    <text class="footerStrong" x="30" y="37">Visual brand principle:</text>
    <text class="footer" x="274" y="37">make technical systems feel simple, credible, and decision-ready.</text>
  </g>
</svg>
