<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">UI UX systems workflow</title>
  <desc id="desc">A visual workflow showing how research, information architecture, prototyping, dashboard design, metrics, and iteration connect.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 800 34px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0F172A; }
      .subtitle { font: 500 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .cardTitle { font: 800 20px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0F172A; }
      .cardText { font: 500 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748B; }
      .metric { font: 800 23px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0F766E; }
    </style>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#surface)"/>
  <text class="title" x="56" y="68">UI/UX as a product operating system</text>
  <text class="subtitle" x="56" y="101">I use design craft to make AI and analytics products clearer, more trusted, and easier to act on.</text>

  <path d="M185 218 C285 145 375 145 475 218 S665 291 765 218 S955 145 1055 218" fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round" opacity="0.65">
    <animate attributeName="stroke-dasharray" values="8 22;22 8;8 22" dur="6s" repeatCount="indefinite"/>
  </path>

  <g filter="url(#shadow)">
    <g transform="translate(56 151)">
      <rect width="174" height="116" rx="18" fill="#FFFFFF" stroke="#BAE6FD"/>
      <circle cx="32" cy="33" r="11" fill="#0EA5E9"/>
      <text class="cardTitle" x="55" y="39">Research</text>
      <text class="cardText" x="22" y="75">Users, jobs,</text>
      <text class="cardText" x="22" y="96">pain points</text>
    </g>
    <g transform="translate(250 151)">
      <rect width="174" height="116" rx="18" fill="#FFFFFF" stroke="#DDD6FE"/>
      <circle cx="32" cy="33" r="11" fill="#8B5CF6"/>
      <text class="cardTitle" x="55" y="39">IA</text>
      <text class="cardText" x="22" y="75">Structure, flows,</text>
      <text class="cardText" x="22" y="96">decision paths</text>
    </g>
    <g transform="translate(444 151)">
      <rect width="174" height="116" rx="18" fill="#FFFFFF" stroke="#CCFBF1"/>
      <circle cx="32" cy="33" r="11" fill="#14B8A6"/>
      <text class="cardTitle" x="55" y="39">Prototype</text>
      <text class="cardText" x="22" y="75">Screens, states,</text>
      <text class="cardText" x="22" y="96">interaction logic</text>
    </g>
    <g transform="translate(638 151)">
      <rect width="174" height="116" rx="18" fill="#FFFFFF" stroke="#FED7AA"/>
      <circle cx="32" cy="33" r="11" fill="#F97316"/>
      <text class="cardTitle" x="55" y="39">Dashboard</text>
      <text class="cardText" x="22" y="75">Hierarchy, filters,</text>
      <text class="cardText" x="22" y="96">signal design</text>
    </g>
    <g transform="translate(832 151)">
      <rect width="174" height="116" rx="18" fill="#FFFFFF" stroke="#C7D2FE"/>
      <circle cx="32" cy="33" r="11" fill="#6366F1"/>
      <text class="cardTitle" x="55" y="39">Metrics</text>
      <text class="cardText" x="22" y="75">Activation, trust,</text>
      <text class="cardText" x="22" y="96">conversion</text>
    </g>
    <g transform="translate(1026 151)">
      <rect width="118" height="116" rx="18" fill="#FFFFFF" stroke="#A7F3D0"/>
      <circle cx="31" cy="33" r="11" fill="#10B981"/>
      <text class="cardTitle" x="51" y="39">Iterate</text>
      <text class="cardText" x="20" y="75">Learn,</text>
      <text class="cardText" x="20" y="96">improve</text>
    </g>
  </g>

  <g transform="translate(56 318)">
    <rect width="1088" height="54" rx="18" fill="#0F172A" opacity="0.94"/>
    <text class="metric" x="28" y="35">Visual brand principle:</text>
    <text class="subtitle" x="286" y="35" fill="#E2E8F0">make complex systems feel understandable, navigable, and measurable.</text>
  </g>
</svg>
