<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">UX-led AI product systems</title>
  <desc id="desc">A polished visual system showing how research, structure, prototyping, instrumentation, and iteration connect in UX-led product work.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="54%" stop-color="#EEF6FF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="48%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="cardShadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/>
    </marker>
    <style>
      .h1 { font: 850 38px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0F172A; }
      .sub { font: 520 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .num { font: 850 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #FFFFFF; }
      .cardTitle { font: 820 21px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0F172A; }
      .cardCopy { font: 560 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748B; }
      .panelTitle { font: 820 22px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #F8FAFC; }
      .panelCopy { font: 580 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #CBD5E1; }
      .footerStrong { font: 850 22px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5EEAD4; }
      .footer { font: 650 20px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #E2E8F0; }
    </style>
  </defs>

  <rect width="1200" height="460" rx="28" fill="url(#bg)"/>
  <path d="M60 112 H690" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <text class="h1" x="60" y="72">UX-led AI product systems</text>
  <text class="sub" x="60" y="101">A design operating model for making complex analytics and AI workflows understandable, trusted, and measurable.</text>

  <g transform="translate(62 154)">
    <path d="M177 75 H214" stroke="#64748B" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M393 75 H430" stroke="#64748B" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M609 75 H646" stroke="#64748B" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

    <g filter="url(#cardShadow)">
      <rect x="0" y="0" width="178" height="150" rx="22" fill="#FFFFFF" stroke="#BAE6FD"/>
      <circle cx="34" cy="34" r="17" fill="#0EA5E9"/>
      <text class="num" x="29" y="40">1</text>
      <text class="cardTitle" x="24" y="76">Discover</text>
      <text class="cardCopy" x="24" y="105">User jobs, pain</text>
      <text class="cardCopy" x="24" y="126">points, success</text>

      <rect x="216" y="0" width="178" height="150" rx="22" fill="#FFFFFF" stroke="#DDD6FE"/>
      <circle cx="250" cy="34" r="17" fill="#8B5CF6"/>
      <text class="num" x="245" y="40">2</text>
      <text class="cardTitle" x="240" y="76">Structure</text>
      <text class="cardCopy" x="240" y="105">Flows, IA, roles,</text>
      <text class="cardCopy" x="240" y="126">decision paths</text>

      <rect x="432" y="0" width="178" height="150" rx="22" fill="#FFFFFF" stroke="#CCFBF1"/>
      <circle cx="466" cy="34" r="17" fill="#14B8A6"/>
      <text class="num" x="461" y="40">3</text>
      <text class="cardTitle" x="456" y="76">Prototype</text>
      <text class="cardCopy" x="456" y="105">Screens, states,</text>
      <text class="cardCopy" x="456" y="126">feedback loops</text>

      <rect x="648" y="0" width="178" height="150" rx="22" fill="#FFFFFF" stroke="#FED7AA"/>
      <circle cx="682" cy="34" r="17" fill="#F97316"/>
      <text class="num" x="677" y="40">4</text>
      <text class="cardTitle" x="672" y="76">Measure</text>
      <text class="cardCopy" x="672" y="105">Trust, adoption,</text>
      <text class="cardCopy" x="672" y="126">conversion</text>
    </g>
  </g>

  <g transform="translate(928 135)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="212" height="210" rx="24" fill="#0F172A"/>
    <text class="panelTitle" x="24" y="42">Design proof</text>
    <text class="panelCopy" x="24" y="78">Clear hierarchy</text>
    <path d="M24 91 H188" stroke="#334155"/>
    <text class="panelCopy" x="24" y="120">Usable states</text>
    <path d="M24 133 H188" stroke="#334155"/>
    <text class="panelCopy" x="24" y="162">Trust signals</text>
    <path d="M24 175 H188" stroke="#334155"/>
    <text class="panelCopy" x="24" y="198">Metric loops</text>
  </g>

  <g transform="translate(60 365)">
    <rect x="0" y="0" width="1080" height="58" rx="20" fill="#0F172A"/>
    <text class="footerStrong" x="28" y="37">Visual brand principle:</text>
    <text class="footer" x="280" y="37">make technical systems feel simple, credible, and decision-ready.</text>
  </g>
</svg>
