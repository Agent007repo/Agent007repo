<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Samarth Annigeri profile hero</title>
  <desc id="desc">A refined Apple-inspired profile hero for AI product systems, data platforms, and UX-led analytics.</desc>
  <defs>
    <radialGradient id="glowA" cx="76%" cy="18%" r="56%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.42"/>
      <stop offset="42%" stop-color="#2563EB" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="25%" cy="88%" r="58%">
      <stop offset="0%" stop-color="#A7F3D0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#93C5FD"/>
    </marker>
    <style>
      .name { font: 760 58px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; fill: #F5F5F7; letter-spacing: 0; }
      .role { font: 520 24px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; fill: #D2D2D7; letter-spacing: 0; }
      .body { font: 450 17px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #A1A1AA; letter-spacing: 0; }
      .chip { font: 600 14px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #F5F5F7; letter-spacing: 0; }
      .panelTitle { font: 700 18px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; fill: #F5F5F7; letter-spacing: 0; }
      .panelText { font: 600 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #F5F5F7; letter-spacing: 0; }
      .panelHint { font: 450 12px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #A1A1AA; letter-spacing: 0; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="34" fill="#020617"/>
  <rect width="1200" height="360" rx="34" fill="url(#glowA)"/>
  <rect width="1200" height="360" rx="34" fill="url(#glowB)"/>
  <path d="M58 78 H620" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.26"/>

  <g transform="translate(64 118)">
    <text class="name" x="0" y="0">Samarth Annigeri</text>
    <text class="role" x="0" y="50">AI product systems, data platforms, and UX-led analytics</text>
    <text class="body" x="0" y="88">Clear interfaces for complex data, model behavior, and product decisions.</text>
  </g>

  <g transform="translate(64 252)">
    <rect x="0" y="0" width="128" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text class="chip" x="23" y="26">Product UX</text>
    <rect x="144" y="0" width="98" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text class="chip" x="176" y="26">LLMs</text>
    <rect x="258" y="0" width="126" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text class="chip" x="290" y="26">Analytics</text>
    <rect x="400" y="0" width="146" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text class="chip" x="431" y="26">Data Systems</text>
  </g>

  <g transform="translate(744 50)" filter="url(#softShadow)">
    <rect x="0" y="0" width="390" height="260" rx="30" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.20"/>
    <rect x="22" y="20" width="346" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <circle cx="46" cy="40" r="5" fill="#FF5F57"/>
    <circle cx="66" cy="40" r="5" fill="#FEBC2E"/>
    <circle cx="86" cy="40" r="5" fill="#28C840"/>
    <text class="panelTitle" x="120" y="47">Product System Map</text>

    <g transform="translate(32 90)">
      <rect x="0" y="0" width="132" height="56" rx="18" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text class="panelText" x="18" y="25">User Need</text>
      <text class="panelHint" x="18" y="43">research signal</text>

      <rect x="204" y="0" width="132" height="56" rx="18" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text class="panelText" x="222" y="25">AI Workflow</text>
      <text class="panelHint" x="222" y="43">reason + retrieve</text>

      <rect x="0" y="104" width="132" height="56" rx="18" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text class="panelText" x="18" y="129">Interface</text>
      <text class="panelHint" x="18" y="147">clarity + trust</text>

      <rect x="204" y="104" width="132" height="56" rx="18" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text class="panelText" x="222" y="129">Metrics</text>
      <text class="panelHint" x="222" y="147">learn + improve</text>

      <path d="M142 28 H190" stroke="#93C5FD" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arrow)"/>
      <path d="M270 62 C270 86 270 86 270 98" stroke="#93C5FD" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arrow)" fill="none"/>
      <path d="M198 132 H146" stroke="#93C5FD" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arrow)"/>
      <path d="M66 98 C66 78 66 78 66 64" stroke="#93C5FD" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arrow)" fill="none" opacity="0.62"/>
    </g>
  </g>
</svg>
