<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Samarth Annigeri profile hero</title>
  <desc id="desc">A polished profile hero for AI product systems, data platforms, and UX-led analytics.</desc>
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08111F"/>
      <stop offset="48%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="heroLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="52%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#051F28"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="#67E8F9"/>
    </marker>
    <style>
      .name { font: 800 56px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #F8FAFC; }
      .role { font: 600 24px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #CBD5E1; }
      .body { font: 500 17px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #94A3B8; }
      .chip { font: 750 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #E2E8F0; }
      .panelTitle { font: 800 20px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #F8FAFC; }
      .panelText { font: 650 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #CBD5E1; }
      .panelHint { font: 500 12px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #94A3B8; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="30" fill="url(#heroBg)"/>
  <path d="M0 260 C160 210 285 318 430 250 C600 170 735 190 905 132 C1040 86 1125 105 1200 76 L1200 360 L0 360 Z" fill="#14B8A6" opacity="0.13"/>
  <path d="M58 72 H660" stroke="url(#heroLine)" stroke-width="4" stroke-linecap="round"/>

  <g transform="translate(64 118)">
    <text class="name" x="0" y="0">Samarth Annigeri</text>
    <text class="role" x="0" y="48">AI product systems, data platforms, and UX-led analytics</text>
    <text class="body" x="0" y="87">I turn ambiguous product and data problems into clear, measurable, usable systems.</text>
  </g>

  <g transform="translate(64 250)">
    <rect x="0" y="0" width="138" height="42" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.65"/>
    <text class="chip" x="22" y="27">Product UX</text>
    <rect x="154" y="0" width="118" height="42" rx="13" fill="#0F172A" stroke="#A78BFA" stroke-opacity="0.65"/>
    <text class="chip" x="190" y="27">LLMs</text>
    <rect x="288" y="0" width="148" height="42" rx="13" fill="#0F172A" stroke="#2DD4BF" stroke-opacity="0.65"/>
    <text class="chip" x="317" y="27">Analytics</text>
    <rect x="452" y="0" width="156" height="42" rx="13" fill="#0F172A" stroke="#FBBF24" stroke-opacity="0.65"/>
    <text class="chip" x="479" y="27">Data Systems</text>
  </g>

  <g transform="translate(742 48)" filter="url(#shadow)">
    <rect x="0" y="0" width="390" height="264" rx="28" fill="url(#panel)" stroke="#334155" stroke-width="1.3"/>
    <rect x="22" y="22" width="346" height="42" rx="14" fill="#020617" stroke="#1E293B"/>
    <circle cx="45" cy="43" r="6" fill="#F97316"/>
    <circle cx="67" cy="43" r="6" fill="#FBBF24"/>
    <circle cx="89" cy="43" r="6" fill="#22C55E"/>
    <text class="panelTitle" x="120" y="50">Product System Map</text>

    <g transform="translate(32 92)">
      <rect x="0" y="0" width="132" height="56" rx="16" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.55"/>
      <text class="panelText" x="18" y="25">User Need</text>
      <text class="panelHint" x="18" y="43">research signal</text>

      <rect x="204" y="0" width="132" height="56" rx="16" fill="#0F172A" stroke="#A78BFA" stroke-opacity="0.55"/>
      <text class="panelText" x="222" y="25">AI Workflow</text>
      <text class="panelHint" x="222" y="43">reason + retrieve</text>

      <rect x="0" y="104" width="132" height="56" rx="16" fill="#0F172A" stroke="#2DD4BF" stroke-opacity="0.55"/>
      <text class="panelText" x="18" y="129">Interface</text>
      <text class="panelHint" x="18" y="147">clarity + trust</text>

      <rect x="204" y="104" width="132" height="56" rx="16" fill="#0F172A" stroke="#FBBF24" stroke-opacity="0.55"/>
      <text class="panelText" x="222" y="129">Metrics</text>
      <text class="panelHint" x="222" y="147">learn + improve</text>

      <path d="M142 28 H190" stroke="#67E8F9" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
      <path d="M270 62 C270 88 270 88 270 98" stroke="#67E8F9" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" fill="none"/>
      <path d="M198 132 H146" stroke="#67E8F9" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
      <path d="M66 98 C66 76 66 76 66 64" stroke="#67E8F9" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" fill="none" opacity="0.65"/>
    </g>
  </g>
</svg>
