<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Samarth Annigeri profile hero</title>
  <desc id="desc">Animated visual brand graphic for AI product, data platforms, and UI/UX work.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="45%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .label { font: 700 56px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #F8FAFC; }
      .sub { font: 500 24px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #CBD5E1; }
      .chip { font: 700 17px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #E2E8F0; letter-spacing: .4px; }
      .small { font: 500 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #94A3B8; }
      .node { filter: url(#softGlow); }
    </style>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <path d="M0 270 C160 210 235 315 390 258 C530 207 625 132 785 177 C930 218 1010 110 1200 150 L1200 360 L0 360 Z" fill="#0EA5A3" opacity="0.12"/>
  <path d="M35 72 H720" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

  <g transform="translate(64 112)">
    <text class="label" x="0" y="0">Samarth Annigeri</text>
    <text class="sub" x="0" y="48">AI product systems | Data platforms | UI/UX-led analytics</text>
    <text class="small" x="0" y="88">Building usable, measurable systems from ambiguous product and data problems.</text>
  </g>

  <g transform="translate(64 244)">
    <rect x="0" y="0" width="145" height="44" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.55"/>
    <text class="chip" x="24" y="28">Product</text>
    <rect x="161" y="0" width="112" height="44" rx="14" fill="#0F172A" stroke="#A78BFA" stroke-opacity="0.55"/>
    <text class="chip" x="195" y="28">AI</text>
    <rect x="289" y="0" width="123" height="44" rx="14" fill="#0F172A" stroke="#2DD4BF" stroke-opacity="0.55"/>
    <text class="chip" x="326" y="28">Data</text>
    <rect x="428" y="0" width="124" height="44" rx="14" fill="#0F172A" stroke="#F59E0B" stroke-opacity="0.55"/>
    <text class="chip" x="466" y="28">UX</text>
  </g>

  <g transform="translate(795 63)">
    <rect x="0" y="0" width="330" height="230" rx="24" fill="#020617" opacity="0.72" stroke="#64748B" stroke-opacity="0.45"/>
    <circle class="node" cx="88" cy="73" r="15" fill="#38BDF8">
      <animate attributeName="r" values="13;18;13" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle class="node" cx="224" cy="62" r="12" fill="#A78BFA">
      <animate attributeName="r" values="10;16;10" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle class="node" cx="171" cy="154" r="14" fill="#2DD4BF">
      <animate attributeName="r" values="12;18;12" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle class="node" cx="72" cy="166" r="10" fill="#F59E0B">
      <animate attributeName="r" values="9;14;9" dur="4s" repeatCount="indefinite"/>
    </circle>
    <path d="M88 73 L224 62 L171 154 L72 166 L88 73 M88 73 L171 154" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
    <text class="small" x="38" y="207">product sense + model behavior + user trust</text>
  </g>
</svg>
